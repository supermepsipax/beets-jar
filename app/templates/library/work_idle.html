{% from "macros/controls.html" import toggle %}
<div class="library-work-idle">
	<div class="library-stats">
		<div class="library-stat-block">
			<label class="library-stat-number">{{ item_count }}</label>
			<label class="library-state-text">Tracks</label>
		</div>
		<div class="library-stat-block">
			<label class="library-stat-number">{{ album_count }}</label>
			<label class="library-state-text">Album{% if album_count > 1%}s{% endif %}</label>
		</div>
	</div>
	<form class="library-query-block"
		hx-get="/api/items" 
		hx-trigger="input delay:250ms, change target:input[type='checkbox']" 
		hx-target="#results">
		<div class="manual-action-row">
			<label for="text">Query: </label>
			<input type="text" name="query" value=""><br>
		</div>
		{{ toggle("album", on="Albums", off="Items", checked=true, label="Search albums or items") }}
	</form>
	<div id="results" class="library-results"></div>
</div>
