{% for plugin, defaults, hash in plugins %}
<div class="plugin-card">
	<h3 class="plugin-name">{{ plugin.name }}</h3>
	{% for cmd in plugin.commands %}
	<p>{{ cmd.name }} ({{ cmd.target }}) {{ defaults[cmd.name] }}{% if cmd.fixed %} fixed={{ cmd.fixed }}{% endif %}</p>
	{% endfor %}
</div>
{% else %}
<p class="panel-empty">No plugins available.</p>
{% endfor %}
