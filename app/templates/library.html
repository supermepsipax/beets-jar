{% extends "base.html" %}

{% block title %}Library - Beets-Jar{% endblock %}

{% block content %}
<div class="library-layout" x-data="{ left: false, right: false }" @keydown.escape.window="left = false; right = false">

	{# Mobile only (hidden by CSS on desktop) #}
	<div class="library-toolbar">
		<button type="button" class="drawer-toggle drawer-toggle-left" @click="left = !left; right = false">
			☰Plugins
		</button>
		<button type="button" class="drawer-toggle drawer-toggle-right" @click="right = !right; left = false">
			Processes
		</button>
	</div>
	<div class="drawer-backdrop" x-show="left || right" x-cloak @click="left = false; right = false"></div>

	<aside id="plugin-panel" class="library-panel drawer" :class="{ 'is-open': left }"
		@click="if ($event.target.closest('.needs-you')) left = false">
   		<h2 class="panel-title">
   			Plugins
   			<span class="help-dot" tabindex="0"
   				title="Switch plugins on, then press Process under your search. Each plugin runs as its own job, one at a time. Settings only change that run; your config stays as it is.">?</span>
   		</h2>
		<div hx-get="/plugins/all" hx-trigger="load"></div>
	</aside>

	<section id="work-area" hx-get="/library/work" hx-trigger="load"></section>

	<aside id="processes" class="library-panel drawer" :class="{ 'is-open': right }">
		<h2 class="panel-title">Processes</h2>
		<!-- <div hx-get="/library/stream/processes" hx-trigger="load"></div> -->
	</aside>
</div>
{% endblock %}
