{% extends "base.html" %}

{% block title %}Configuration - Beets-Jar{% endblock %}

{% block content %}
<div class="config-page">
	<form id="config-form" class="work-card config-card"
	      hx-post="/configuration" hx-target="#config-status" hx-swap="outerHTML">
		<div class="import-card-header config-bar">
			<strong class="import-card-title">config.yaml</strong>
			<div class="config-actions">
				{% include "partials/config_status.html" %}
				<button type="submit" class="button-secondary" disabled>Save</button>
			</div>
		</div>
		<textarea name="yaml_text" spellcheck="false" wrap="off">{{ yaml_text }}</textarea>
		<div id="config-editor" data-keymap="{{ keymap }}"></div>
	</form>
</div>
<script type="module" src="/static/config-editor.js"></script>
{% endblock %}
