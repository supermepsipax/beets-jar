{% extends "base.html" %}
{% from "macros/controls.html" import drawer_toolbar %}

{% block title %}Library - Beets-Jar{% endblock %}

{% block content %}
<div class="split-layout" x-data="{ openDrawer: null }" @keydown.escape.window="openDrawer = null">
	{{ drawer_toolbar("☰ Plugins", "Processes") }}

	<aside id="plugin-panel" class="side-panel drawer-left" :class="{ 'is-open': openDrawer === 'left' }">
		<div class="panel-head">
			<h2 class="panel-title">Plugins</h2>
			<span class="help-dot" tabindex="0"
				title="Switch plugins on, then press Process under your search. Each plugin runs as its own job, one at a time. Settings only change that run; your config stays as it is.">?</span>
		</div>
		<div hx-get="/library/plugins" hx-trigger="load"></div>
	</aside>

	<section id="work-area">
		{% include "library/work_idle.html" %}
	</section>

	<aside id="processes" class="side-panel drawer-right" :class="{ 'is-open': openDrawer === 'right' }">
		<h2 class="panel-title">Processes</h2>
		<div hx-sse:connect="/library/stream/processes" hx-swap="innerMorph"></div>
	</aside>
</div>
{% endblock %}
