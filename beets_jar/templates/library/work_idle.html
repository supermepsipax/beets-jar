{% from "macros/controls.html" import toggle %}
<div class="work-idle">
	<form class="library-query"
		hx-get="/library/query-results"
		hx-trigger="input delay:250ms, submit, change target:input[type='checkbox']" 
		hx-sync="this:queue last"
		hx-target="#results">
		<div class="library-query-row">
			<input type="search" autocomplete="off" name="query" value="" aria-label="Search library">
			{{ toggle("album", on="Albums", off="Items", checked=true, label="Search albums or items") }}
		</div>
	</form>
	<div id="results" class="library-results"></div>
</div>
