<div class="resume-prompt">
	<p>An earlier import of <strong>{{ prompt.path }}</strong> was interrupted. Pick up where it left off?</p>

	<div class="work-actions">
		<form hx-post="{{ choose_url }}" hx-target="#work-area">
			<input type="hidden" name="type" value="action">
			<input type="hidden" name="value" value="yes">
			<button type="submit">Resume</button>
		</form>
		<form hx-post="{{ choose_url }}" hx-target="#work-area">
			<input type="hidden" name="type" value="action">
			<input type="hidden" name="value" value="no">
			<button type="submit" class="button-secondary">Start over</button>
		</form>
	</div>
</div>
