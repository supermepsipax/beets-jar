<div class="work-idle" data-work="idle">
	{% if pending %}
	<button type="button" class="work-pending" x-show="!auto" hx-get="/import/work" hx-target="#work-area">
		{{ pending }} waiting on you →
	</button>
	{% endif %}

	<div class="drop-zone" aria-disabled="true">
		<strong>Drop folders or zips here</strong>
		<span>Coming soon</span>
	</div>

	<form class="path-form" hx-post="/import/start" hx-target="#work-area">
		<label for="import-path">Or import a folder on the server</label>
		<div class="manual-action-row">
			<input id="import-path" name="path" placeholder="/music/incoming/Album" required>
			<button type="submit">Import</button>
		</div>
	</form>

	{% if quick_imports %}
	<div class="quick-import">
		<label>Quick Import</label>
		<div class="work-actions">
			{% for label, folder in quick_imports %}
			<form hx-post="/import/start" hx-target="#work-area">
				<input type="hidden" name="path" value="{{ folder }}">
				<button type="submit" class="button-secondary">{{ label }}</button>
			</form>
			{% endfor %}
		</div>
	</div>
	{% endif %}

	{% if note %}<p class="work-note">{{ note }}</p>{% endif %}
	{% if error %}<p class="work-error">{{ error }}</p>{% endif %}
</div>
