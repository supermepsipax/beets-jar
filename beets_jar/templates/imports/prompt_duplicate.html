<div class="duplicate-prompt">
	<h3>Already in your library</h3>

	<dl class="duplicate-summary">
		{% for line in prompt.duplicate_summary.old %}
		<dt>In library</dt>
		<dd>{{ line | replace("Old: ", "", 1) }}</dd>
		{% endfor %}
		<dt>This import</dt>
		<dd>{{ prompt.duplicate_summary.new | replace("New: ", "", 1) }}</dd>
	</dl>

	<div class="work-actions">
		{% for choice in prompt.choices %}
		<form hx-post="{{ choose_url }}" hx-target="#work-area">
			<input type="hidden" name="type" value="action">
			<input type="hidden" name="value" value="{{ choice.short }}">
			<button type="submit" class="button-secondary">{{ choice.long }}</button>
		</form>
		{% endfor %}
	</div>
</div>
