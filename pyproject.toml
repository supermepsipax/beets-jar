[project]
name = "beets-jar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.3",
]
[tool.jinja-lsp]
templates = "./beets_jar/templates"
backend = ["./beets_jar/routers"]

[dependency-groups]
# beets itself is provided by the host install when used as a plugin;
# only the container and dev environments need it installed here.
beets = [
    "beets>=2.14.0",
]
dev = [
    {include-group = "beets"},
    "watchfiles>=1.0.5",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beets_jar", "beetsplug"]
