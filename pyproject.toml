[project]
name = "beets-jar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beets[all]>=2.13.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.3",
]
[tool.jinja-lsp]
templates = "./app/templates"
backend = ["./app/routers"]

[dependency-groups]
dev = [
    "watchfiles>=1.0.5",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "beetsplug"]
